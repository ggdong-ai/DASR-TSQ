# REINVENT4 Mol2Mol engineering smoke for the frozen GSK3β/JNK3 project.
# NOT a formal paper result. Two RL steps only.

run_type = "staged_learning"
device = "cuda:0"
tb_logdir = "D:/pycharm/project/tsq_mcts_rebuild/06_paper/experiment_records/external_benchmark_v4_reinvent4_preflight/seed_42/tb"
json_out_config = "D:/pycharm/project/tsq_mcts_rebuild/06_paper/experiment_records/external_benchmark_v4_reinvent4_preflight/seed_42/resolved_config.json"

[parameters]
prior_file = "D:/pycharm/project/tsq_mcts_rebuild/08_external/REINVENT4_official/priors/mol2mol_medium_similarity.prior"
agent_file = "D:/pycharm/project/tsq_mcts_rebuild/08_external/REINVENT4_official/priors/mol2mol_medium_similarity.prior"
smiles_file = "D:/pycharm/project/tsq_mcts_rebuild/06_paper/experiment_records/external_benchmark_v4_reinvent4_preflight/reinvent4_formal_p0.smi"

summary_csv_prefix = "D:/pycharm/project/tsq_mcts_rebuild/06_paper/experiment_records/external_benchmark_v4_reinvent4_preflight/seed_42/reinvent4_smoke"
use_checkpoint = false
purge_memories = false

# Frozen-source Mol2Mol semantics replicate each conditioning SMILES batch_size times.
# With P0=200 and batch_size=1 this gives 200 conditioning inputs per RL step.
batch_size = 1
randomize_smiles = true
sample_strategy = "multinomial"
distance_threshold = 100
tb_isim = false

[learning_strategy]
type = "dap"
sigma = 128
rate = 0.0001

[diversity_filter]
type = "IdenticalMurckoScaffold"
bucket_size = 25
minscore = 0.4
minsimilarity = 0.4
penalty_multiplier = 0.5

[[stage]]
chkpt_file = "D:/pycharm/project/tsq_mcts_rebuild/06_paper/experiment_records/external_benchmark_v4_reinvent4_preflight/seed_42/reinvent4_smoke.chkpt"
termination = "simple"
max_score = 1.0
min_steps = 2
max_steps = 2

[stage.scoring]
# One endpoint only: arithmetic_mean leaves the frozen final_reward unchanged.
type = "arithmetic_mean"
parallel = 1

[[stage.scoring.component]]
[stage.scoring.component.FrozenProjectReward]

[[stage.scoring.component.FrozenProjectReward.endpoint]]
name = "Frozen project final reward"
weight = 1.0
params.project_root = "D:/pycharm/project/tsq_mcts_rebuild"
params.technical_request_cap = 1000000
params.state_json = "D:/pycharm/project/tsq_mcts_rebuild/06_paper/experiment_records/external_benchmark_v4_reinvent4_preflight/seed_42/oracle_state.json"
